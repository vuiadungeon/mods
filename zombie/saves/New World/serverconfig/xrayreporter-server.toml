#Discord webhook URL for xray detection notifications. Leave empty to disable Discord alerts.
discordWebhookUrl = ""
#Discord role mention string to ping on detections (e.g. <@&123456789>). Leave empty to disable pings.
discordAdminRoleMention = ""
#Automatically ban players whose resourcepack is confirmed as an xray pack (suspicion score >= 4).
#Disabled by default — enable only after reviewing initial reports to avoid false positives.
autoBan = false
#Kick/ban message shown to auto-banned players.
autoBanMessage = "You have been banned for using an xray resourcepack."
#Whitelisted resourcepacks that will never trigger autoban.
#Accepts SHA-256 hashes (preferred) or exact filenames. One entry per line.
#Example: ["a1b2c3d4...", "Gray's Animal Overhaul v1.0 1.19-1.20.2.zip"]
whitelist = []

