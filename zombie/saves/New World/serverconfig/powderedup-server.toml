#Whether clients may preview charged throws with a trajectory arc and impact marker.
enableThrowPreviewing = true
#Whether disguise activations are written to the server console and latest.log.
logDisguiseUses = true
#Whether Powdered Up death messages may reveal a grenade user's name.
#Deadman's Switch kills are named. Thrown or automatically triggered explosives are named
#only when the victim can see the killer or damaged them during the previous two seconds.
#Remote and laser detonator kills always remain anonymous.
enableGrenadeKillerNames = true
#Whether pipe bombs may destroy terrain and soft materials.
pipeBombDestroysBlocks = true
#Whether nail bombs may destroy terrain and soft materials.
nailBombDestroysBlocks = true
#Whether frag grenades may destroy terrain and soft materials.
fragGrenadeDestroysBlocks = true
#Whether impact grenades may destroy terrain and soft materials.
impactGrenadeDestroysBlocks = true
#Whether flashbang shockwaves may destroy soft materials.
flashbangDestroysBlocks = true
#Whether smoke grenade activation may destroy nearby soft materials.
smokeGrenadeDestroysBlocks = false
#Whether thermite grenades may melt or destroy blocks.
incendiaryDestroysBlocks = true
#Whether Molotovs may destroy flammable blocks and nearby soft materials.
molotovDestroysBlocks = true

